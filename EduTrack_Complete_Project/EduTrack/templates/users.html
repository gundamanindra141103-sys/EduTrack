{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h2 class="fw-bold mt-1">User management</h2><p class="text-secondary">Create teacher, student and admin accounts.</p></div></div>
<div class="row g-4"><div class="col-lg-4"><div class="content-card"><h5 class="fw-bold">Create user</h5><form method="post"><label class="form-label mt-2">Full name</label><input class="form-control" name="name" required><label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required><label class="form-label mt-3">Temporary password</label><input class="form-control" type="password" name="password" minlength="8" required><label class="form-label mt-3">Role</label><select class="form-select" name="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select><button class="btn btn-accent w-100 mt-4">Create account</button></form></div></div>
<div class="col-lg-8"><div class="content-card"><h5 class="fw-bold">All users</h5><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role|title }}</td></tr>{% endfor %}</tbody></table></div></div></div></div>
{% endblock %}
