{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">JOIN EDUTRACK</span><h2 class="fw-bold mt-2">Create student account</h2><p class="text-secondary">Register to access courses and academic records.</p>
<form method="post" class="mt-4"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100">
<label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
<button class="btn btn-accent w-100">Create account</button></form><p class="small text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div></div>{% endblock %}
